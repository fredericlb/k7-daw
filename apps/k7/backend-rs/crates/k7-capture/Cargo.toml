[package]
name = "k7-capture"
description = "Live sync's capture native: the disk files under .sync, the ledger, the blob cache, the link records and the sync state, as packages/file-service keeps them (docs/file-capture.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The lexical path model and the file filter, shared with the native reads (1a).
k7-file-service.workspace = true
# `String(number)` and `textHash`.
k7-js.workspace = true
# The wire's path rule, the atomic write, `JSON.stringify` and the blob ref's parse.
k7-sync.workspace = true
# The replica's `Confirmed` store, which the confirmed folder implements.
k7-replica.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
indexmap.workspace = true
hyper.workspace = true
# The worker: a task per workspace, its timers and the blocking pool its file steps run on.
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "fs", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
