[package]
name = "eyes"
version = "0.1.0"
edition = "2024"
description = "What the page's compositor (ui-eyes) draws, as Rust: the scene it takes, a layer's clip schedule, the built-in transitions, a `.cube` LUT, a lens matched by its label and a rect dragged by a grip (docs/eyes.md)."
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
ts-rs = { version = "11", optional = true }

[features]
ts = ["dep:ts-rs"]
