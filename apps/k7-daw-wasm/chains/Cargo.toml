[package]
name = "chains"
version = "0.1.0"
edition = "2024"
description = "The Chains tab's logic in Rust: the graph's build and measure steps, a widget's value maths, the surface bindings, after ../../k7-daw-frontend/packages/ui-chains/src/."
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
ts-rs = { version = "11", optional = true }
rust-sugiyama = "0.4.0"
petgraph = "0.8.3"

[features]
ts = ["dep:ts-rs"]
