common:
  # The dev session's install token, the `k7.sid` cookie a page presents (apps/k7/backend-rs/docs/sessions.md).
  # The e2e suites read it from here; left empty, the front draws one and keeps it in its auth folder.
  K7_SESSION_TOKEN: ""

k7-front:
  # Every section here is named after its service. A stale section name is not an
  # error — `loadServiceEnv` returns {} for a section it cannot find — so a file
  # carrying a spelling this one no longer uses silently falls back to `common` alone.
  #
  # The dev session is a DEVICE on loopback, as the tray and the e2e beds are: no login, the
  # page opens on http://127.0.0.1:5223 and `/auth/me` hands it the token
  # (loopback peers only).
  STUDIO_LOCAL_USER: "1"
  K7_INSTANCE: "local"
  # The instance's data folder (`~/.k7/mediatek` by default).
  STUDIO_MEDIATEK: "/data/mediatek"
  # The accounts' workspaces, one file service per account under this folder — the ONLY place a
  # workspace lives (apps/k7/backend-rs/docs/files/hub.md). REQUIRED: without it the front answers no file hub.
  STUDIO_FILES_ROOT: "/data/workspaces"
  # What this service remembers about a person; defaults to ~/.studio/prefs/k7.
  # STUDIO_PREFS_DIR: "/data/prefs"
