common:
  # Signs the session cookie of the dev session's device front. At least 32 characters; the
  # merge is common-then-service, so a section CAN override this, and `SESSION_SECRET: ""`
  # overrides just as loudly.
  SESSION_SECRET: ""
  # The other origins that may call the API with the cookie, comma-separated, e.g. "https://other.example";
  # empty while the dev session answers its own origin alone (apps/k7/backend/docs/cors.md).
  TRUSTED_ORIGINS: ""

k7-backend:
  # Every section here is named after its service's PACKAGE. A stale section name is not an
  # error — `loadServiceEnv` returns {} for a section it cannot find — so a deployment
  # carrying a spelling this file no longer uses silently falls back to `common` alone.
  #
  # The dev session is a DEVICE on loopback, as the tray and the e2e beds are: no login, the
  # page opens on http://127.0.0.1:5223 and `/auth/local` signs the machine's own user in
  # (loopback peers only).
  STUDIO_LOCAL_USER: "1"
  K7_INSTANCE: "local"
  STUDIO_LISTEN_HOST: "127.0.0.1"
  # Accepts the short SESSION_SECRET a dev machine may carry (apps/k7/backend/docs/hardening.md).
  STUDIO_DEV_AUTH: "1"
  #
  # The MEDIA LIBRARY (apps/k7/backend/src/media/): everything below is that side's.
  # Signs the tokens a machine uses to sync its cache (it has no cookie jar). Rotating it
  # revokes every token at once — they carry no server state. Leave it empty and
  # `npm run tokens` generates one: unset, the backend falls back to
  # SESSION_SECRET + a suffix, so rotating the session secret would log everyone
  # out AND revoke every sync in one move. See docs/tokens.md.
  API_TOKEN_SECRET: ""
  # The library volume. Optional — absence just means the default
  # (`~/.k7/mediatek`, same as every other backend), see apps/k7/backend/docs/config.md.
  # No GRIST_*: the library is a folder, not a database.
  STUDIO_MEDIATEK: "/data/mediatek"
  # The accounts' workspaces, one file service per account under this folder — the ONLY place a
  # workspace lives (apps/k7/backend-rs/docs/files/hub.md). REQUIRED: without it the front answers no file hub.
  STUDIO_FILES_ROOT: "/data/workspaces"
  # What this service remembers about a person; defaults to ~/.studio/prefs/k7 (/data/prefs in the image).
  # STUDIO_PREFS_DIR: "/data/prefs"
  # Optional, defaults to a DOT-DIRECTORY under STUDIO_MEDIATEK (the instance's data folder), which
  # keeps it out of every scan and unreachable through the file API.
  #   STUDIO_PROJECTS_DIR  the email-to-subject directory (.projects) —
  #                        no clone of any repository lives here
  # Set it only to put it on a different disk.
  # STUDIO_PROJECTS_DIR: "/data/projects"
  #
  # The bearer a developer publishes the apps' builds on /app_downloads
  # with — the APP_RELEASE_TOKEN value. Empty refuses uploads; the page still
  # serves what is there (docs/app-downloads.md). A dev machine needs none.
  # APP_RELEASE_TOKEN: ""

# The file service's MEDIATEK_URL and MEDIATEK_TOKEN are not set here: k7's backend starts it,
# one per account, and hands both down minted for that account.

