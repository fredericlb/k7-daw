version: 47
jobs:
- name: lint and test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up cargo cache
    key: cargo-testbed
    paths:
    - /usr/local/cargo/registry
    - /root/k7-testbed-target
    uploadStrategy: UPLOAD_IF_CHANGED
    condition: SUCCESSFUL
    optional: false
  # The engine core's suites drive the Rust testbed alone (apps/k7/backend-rs/docs/engine.md, "The testbed").
  - type: CommandStep
    name: check the Cargo locks, build the engine testbed
    runInContainer: true
    image: rust:1.97.1-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        # No debug info: the binary only runs the suites, and the cached target stays a fraction of its size.
        export CARGO_TARGET_DIR=/root/k7-testbed-target CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0
        # Each Rust workspace's lock still pins its manifests: the tray links the backend's crates by path (docs/lints.md).
        (cd apps/k7-tray/src-tauri && cargo metadata --locked --format-version 1 >/dev/null)
        (cd packages/song-schema/rust && cargo metadata --locked --format-version 1 >/dev/null)
        (cd packages/k7-wasm/rust && cargo metadata --locked --format-version 1 >/dev/null)
        (cd packages/song/rust && cargo metadata --locked --format-version 1 >/dev/null)
        # The song crate must build for the browser before the browser uses it, so its wasm32 build is not optional (docs/rustCompiler.md).
        rustup target add wasm32-unknown-unknown
        rustup component add clippy
        (cd packages/song/rust && cargo clippy --locked --target wasm32-unknown-unknown --no-default-features -- -D warnings && cargo build --locked --target wasm32-unknown-unknown --no-default-features)
        cd apps/k7/backend-rs
        cargo metadata --locked --format-version 1 >/dev/null
        cargo build --locked -p k7-front --features test-hooks --bin k7-engine-testbed
        # Into the workspace, which the next step's container sees and the cache's does not.
        cp /root/k7-testbed-target/debug/k7-engine-testbed ../../../k7-engine-testbed
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint and test
    runInContainer: true
    image: node:24-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        # Without it sh answers with the LAST command's status, and an earlier failure passes.
        set -e
        # No C toolchain: ssh2's crypto binding is optional, and node-pty is out of the workspace (docs/remote.md).
        apk add --no-cache git ffmpeg
        # 14s from the npm cache above; a cached node_modules (1.2 GB) would cost more to move than that.
        npm ci
        # The step above's testbed; without it a core suite fails rather than skips (packages/engine-tunnel/testCore.ts).
        export ENGINE_CORE_BIN="$PWD/k7-engine-testbed" ENGINE_CORE_REQUIRED=1
        # The four checks at once, each one's output grouped, and red if any one is — docs/tests.md.
        # Two test workspaces at a time, not four: four starve the disk tests past 30 s.
        npx concurrently --group --names lint,bytes,typecheck,test \
          "npm run lint" "npm run lint:bytes" "npm run typecheck -- --jobs 2" "npm run test -- --jobs 2"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  # main only: a ci/ branch's gate is "lint and test macos", the docker executor being shared by every container job (docs/release.md).
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# The same lint, typecheck and tests natively on the macOS agent, started by hand: branches are checked on the Mac itself (docs/agent-playbook.md).
- name: lint and test macos
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: lint and test
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        bash engine/scripts/ci/lint-test-macos.sh
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
# The backend's tests on Linux under musl, started by hand: no branch triggers it (docs/agent-playbook.md, docs/rust-builds.md).
- name: rust checks
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up npm cache
    key: npm-cache
    paths:
    - /root/.npm
    uploadStrategy: UPLOAD_IF_CHANGED
    uploadAccessTokenSecret: cache-upload-token
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up cargo cache
    key: cargo-checks
    paths:
    - /usr/local/cargo/registry
    - /root/k7-checks-target
    uploadStrategy: UPLOAD_IF_CHANGED
    uploadAccessTokenSecret: cache-upload-token
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: clippy and tests
    runInContainer: true
    image: rust:1.97.1-alpine
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        # node for the tests that read node_modules, ffmpeg for the transcoding ones.
        apk add --no-cache musl-dev nodejs npm git ffmpeg
        npm ci --ignore-scripts
        export CARGO_TARGET_DIR=/root/k7-checks-target CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=4
        # Linux holds only what is Linux's own: processes, paths and sockets under musl. Clippy, fmt and the browser crates run on Windows and the Mac (docs/rust-builds.md).
        areas="$(node engine/scripts/ci/areas.mjs)"
        echo "areas touched since base/main: [$areas]"
        case " $areas " in *" backend "*) (cd apps/k7/backend-rs && cargo test --locked --workspace --no-fail-fast) ;; *) echo "the backend is untouched: nothing to run" ;; esac
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# The same checks natively on the macOS agent, started by hand, each ref keeping its own target folder there between runs (docs/release.md).
- name: rust checks macos
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: clippy and tests
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        bash engine/scripts/ci/rust-checks-macos.sh "@branch@"
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# The same checks natively on the Windows agent, set aside and started by hand only (docs/agent-playbook.md).
- name: rust checks windows
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: clippy and tests
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        call engine\scripts\ci\rust-checks-windows.cmd "@branch@" || exit /b 1
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 5400
# The functional and conformance suites against a dev session of the macOS agent's own: its engine, front, backend and
# Vite, in ~/k7-trees/tree-e2e-macos, never paired with a server. Started by hand on any ref (e2e/docs/e2e.md).
- name: e2e macos
  paramSpecs:
  - type: ChoiceParam
    name: suite
    description: web, conformance, or both one after the other
    allowMultiple: false
    allowEmpty: false
    choiceProvider:
      type: SpecifiedChoices
      choices:
      - value: web
      - value: conformance
      - value: both
    defaultValueProvider:
      type: SpecifiedDefaultValue
      value: web
  - type: TextParam
    name: filter
    description: Playwright's file filters, space-separated (empty runs every spec)
    allowEmpty: true
    multiline: false
  - type: TextParam
    name: ref
    description: the branch, tag or commit to test (empty is the build's commit)
    allowEmpty: true
    multiline: false
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: HttpCredential
      accessTokenSecret: submodule-token
    withLfs: false
    withSubmodules: false
    cloneDepth: 1
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: bed and suites
    runInContainer: false
    interpreter:
      type: DefaultInterpreter
      commands: |
        set -e
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
        export GIT_CONFIG_VALUE_0="OneDevAuthorization: Bearer @secret:submodule-token@"
        ref="@param:ref@"
        export E2E_SUITE="@param:suite@" E2E_FILTER="@param:filter@"
        node engine/scripts/ciTree.mjs --tree e2e-macos --repo @server_url@/@project_path@ --commit "${ref:-@commit_hash@}" --fetch-dir "$HOME/k7-trees/deps-e2e-macos" --run "$PWD/engine/scripts/ci/e2e-macos.sh"
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the reports and logs
    artifacts: e2e-out/**
    condition: ALWAYS
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 10800
# The conformance suite alone on the same bed, by hand only: the same tree and lock, so it waits for an e2e run there.
- name: conformance macos
  paramSpecs:
  - type: TextParam
    name: filter
    description: Playwright's file filters, space-separated (empty runs every spec)
    allowEmpty: true
    multiline: false
  - type: TextParam
    name: ref
    description: the branch, tag or commit to test (empty is the build's commit)
    allowEmpty: true
    multiline: false
  steps:
  - type: CheckoutStep
    name: checkout
