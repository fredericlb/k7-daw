[package]
name = "k7-file-service"
description = "The file service's native reads (step 1a of the Rust and WASM port): the path model, the libraries' roots, a file's text and the tree, over a workspace's folder, with no HTTP and no runtime (docs/file-native.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Pins are k7x files; the same parser the bundle reads through (apps/k7-daw-frontend/packages/k7x/docs/rust.md).
indexmap.workspace = true
k7x = { path = "../../../k7-daw-wasm/k7x" }
serde_json.workspace = true
# The store's folder name is a SHA-256 of the project's path (1723); the gate is tokio's RwLock, no runtime (1734).
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
# The crate's `Roots`, which `song_ask` builds (1117), the engine row of /module-libraries (1424), and a project's surfaces are song's own decoders; a demo's stamp is a SHA-1 (docs/file-workspaces.md).
song = { path = "../../../k7-daw-wasm/song" }
# `textHash` and the plugin compatibility score: one Rust source for the page (k7-wasm) and this service.
song-schema = { path = "../../../k7-daw-wasm/song-schema" }
sha1.workspace = true
# `String(n)` for a stamp's mtime and `Math.round` for a row's editedAt.
k7-js.workspace = true
# The server's own edits of a person's files (3j): the editor is pure and holds no disk, `edits` hands it one.
song-edit = { path = "../../../k7-daw-wasm/song-edit" }
# A command line run natively over the staged workspace (`edits/verb.rs`, docs/verbs-port.md).
verbs = { path = "../../../k7-daw-wasm/verbs" }
# One watcher for the process (1326): the workspace's own pin, no new crate.
notify.workspace = true
# `slotIdOf` folds accents with the full NFD, as `normalize("NFD")` does.
unicode-normalization.workspace = true
# A job's id is 128 random bits (verb_host/jobs.rs).
getrandom.workspace = true

# Already the workspace's: the flags of a non-blocking, link-refusing open.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
