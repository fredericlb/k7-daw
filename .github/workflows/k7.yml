# k7 CI — lint, typecheck and the tests of the frontend and its packages, and the supervisor's tunnel agent built.
#
# It runs on every push to main and every `vX.Y.Z` tag, with no path filter. Its JOBS stay narrow:
# not the whole repo's 62 test tasks, and no C++ engine.
#
# The file name and the gating job `name:` fields are load-bearing: branch protection matches on them.

name: k7

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# A second push to a ref makes the first run pointless.
concurrency:
  group: k7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/node


      # Only the frontend folder (its packages too) is named, so `apps/k7-daw-engine/k7-runtime`'s C++ test script never runs here.
      - name: test
        run: npm run test --workspace=apps/k7-daw-frontend --if-present

      # `build` is `tsc --noEmit` for every package; for web/frontend it is a real
      # `vite build && tsc --noEmit`, which is a stronger gate and worth the minute.
      - name: typecheck + build
        run: npm run build --workspace=apps/k7-daw-frontend --if-present

  supervisor:
    name: supervisor (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The supervisor's and the hub's tests run in the Mac's checks (docs/rust-builds.md); here, the agent the e2e stand-in runs.
      - name: build the tunnel harness
        working-directory: apps/k7-daw-backend
        run: cargo build --locked -p k7-supervisor --bin tunnel_harness

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/node
      # Errors fail the build; warnings are the backlog biome still reports, and do not.
      - run: npm run lint
      - run: npm run lint:bytes
      # One version, the root package.json's, in every copy of it (docs/versioning.md).
      - run: npm run lint:version
