[package]
name = "k7-hub"
description = "The file hub's pieces: tickets, account names and environments, engine bindings, the seam to the tunnel hub."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# JavaScript's number spelling, for the ticket's expiry and the engine's plugin list (docs/files.md).
k7-js.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["time", "rt", "net", "sync", "macros", "io-util"] }
# The one-shot channel the engine lists its plugins on.
tokio-tungstenite = { workspace = true, features = ["connect"] }

[dev-dependencies]
hyper.workspace = true
tokio = { workspace = true, features = ["time", "rt", "rt-multi-thread", "macros", "net"] }
