[package]
name = "k7-local"
description = "The machine's own engine run by its own backend: apps/k7-daw-engine/k7-supervisor hosted over NDJSON stdio, kept running, stopped cleanly, and its engine killed only on pidfile proof."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Local wall-clock for the merged log's `HH:MM:SS [host]` lines, and macOS's `ps -o lstart=` read as local seconds.
chrono = { workspace = true }
serde_json.workspace = true
# process: the supervisor as an async child, its death read from the process itself.
tokio = { workspace = true, features = ["process", "time", "rt"] }
url.workspace = true

# A supervisor speaking the host protocol, for the tests alone: `tests/all/host.rs` runs it through `CARGO_BIN_EXE_k7-fake-supervisor`.
[[bin]]
name = "k7-fake-supervisor"
path = "src/bin/fake_supervisor.rs"
test = false
doc = false

# The front running this crate's engine end to end (`tests/all/front.rs`): a dev-dependency cycle Cargo allows for tests.
[dev-dependencies]
axum.workspace = true
k7-front.workspace = true
tokio = { workspace = true, features = ["process", "time", "rt", "rt-multi-thread", "macros", "net"] }
