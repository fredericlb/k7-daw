[package]
name = "k7-git"
description = "A workspace as a git repository over libgit2: status, commit, log, and the transports that fetch and push (docs/git.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
git2.workspace = true
git-rules.workspace = true
k7-sync.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
russh.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "io-util"] }
url.workspace = true

# The device's SSH key lives in the device's keychain where there is one; Android keeps a file (auth/secret.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { workspace = true, features = ["v1"] }

# The protected-data keychain: iOS's store, and a Mac app's synced tokens when it carries its profile (auth/secret_apple.rs).
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
apple-native-keyring-store.workspace = true
keyring-core.workspace = true

[dev-dependencies]
git2.workspace = true
base64.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
russh.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync"] }
webpki-roots.workspace = true
