        ref="@param:ref@"
        export E2E_SUITE=conformance E2E_FILTER="@param:filter@"
        node engine/scripts/ciTree.mjs --tree e2e-macos --repo @server_url@/@project_path@ --commit "${ref:-@commit_hash@}" --fetch-dir "$HOME/k7-trees/deps-e2e-macos" --run "$PWD/engine/scripts/ci/e2e-macos.sh"
    useTTY: false
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish the reports and logs
    artifacts: e2e-out/**
    condition: ALWAYS
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 10800