<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the keyboard shrinks the page, so a centred dialog stays above it rather than under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0e11" />
    <!-- iOS grants a standalone launcher with no service worker and no https, which is the only
         way a surface loses its address bar on a tablet reaching this machine over the LAN.
         `black` and not `black-translucent`: the latter draws under the status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="K7 DAW" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>K7 DAW · editor</title>
    <!-- The startup splash, drawn before any script and replaced by React's first render (docs/icons.md). -->
    <style>
      .k7-splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; background: #07031F; padding: 0 24px; }
      .k7-splash img { width: 280px; height: auto; }
      /* The ring and the line are the shell page's, pixel for pixel (engine/k7-android/web/src/Backend.tsx): the phone hands k7's splash over to this one. */
      .k7-splash-ring { box-sizing: border-box; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #2a2450; border-top-color: #b7b0d9; animation: k7-splash-turn 900ms linear infinite; }
      /* Two lines reserved, so a longer step moves neither the cassette nor the ring above it. Longhands on purpose: a `font:` shorthand resets tabular-nums, and the minifier reorders them. */
      .k7-splash p { margin: 0; min-height: 2.8em; width: min(80vw, 420px); text-align: center; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.4; font-variant-numeric: tabular-nums; color: #b7b0d9; }
      @keyframes k7-splash-turn { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Beside the root, not in it: React's first render keeps it, and the startup waits hold it until the first screen (docs/icons.md). -->
    <div id="k7-splash" class="k7-splash" role="status"><img src="/icon/k7-splash.svg" alt="K7 DAW" /><span class="k7-splash-ring" aria-hidden="true"></span><p id="k7-splash-status">Loading K7 DAW…</p></div>
    <script>
      // The splash's line, before any of k7's code: its files arriving, counted, until the app writes its own step there.
      (() => {
        const line = document.getElementById("k7-splash-status");
        let fr = false;
        try {
          fr = localStorage.getItem("PARAGLIDE_LOCALE") === "fr";
        } catch {}
        const label = fr ? "Chargement de k7…" : "Loading K7 DAW…";
        line.textContent = label;
        if (!("PerformanceObserver" in window)) return;
        let files = 0;
        const watch = new PerformanceObserver((list) => {
          if (!line.isConnected || line.dataset.app) return watch.disconnect();
          files += list.getEntries().length;
          line.textContent = `${label} ${fr ? `${files} fichiers reçus` : `${files} files received`}`;
        });
        watch.observe({ type: "resource", buffered: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
