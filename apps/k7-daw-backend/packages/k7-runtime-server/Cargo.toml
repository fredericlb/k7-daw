[package]
name = "k7-runtime-server"
description = "The engine's WebSocket server in Rust, over the C++ Tracktion host's C ABI (docs/rust-engine-server-plan.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
# The staticlib is what the C++ engine targets link (docs/link.md); the rlib is what the tests and the rest of the server use.
crate-type = ["rlib", "staticlib"]

[dependencies]
serde_json.workspace = true
# The stub socket's handshake (src/stub.rs): M2's socket brings its own.
base64.workspace = true
sha1.workspace = true
# A reply from the message thread: `Engine::call`'s one-shot channel.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

[[test]]
name = "all"
path = "tests/all/main.rs"
