[package]
name = "k7-supervisor"
description = "The engine machine's supervisor in Rust: starts, adopts and watches k7-runtime, speaks the host protocol over NDJSON stdio (docs/rust-supervisor-plan.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "k7-supervisor"
path = "src/main.rs"
test = false
doc = false

# An engine that speaks the engine wire from files, for the queries part's tests: `tests/all/queries.rs`.
[[bin]]
name = "k7-ws-engine"
path = "src/bin/ws_engine.rs"
test = false
doc = false

# An engine that only listens, for the tests alone: `tests/all/supervisor.rs` runs it through `CARGO_BIN_EXE_k7-fake-engine`.
[[bin]]
name = "k7-fake-engine"
path = "src/bin/fake_engine.rs"
test = false
doc = false

[dependencies]
# Local wall-clock for the merged log's `HH:MM:SS`, UTC for the identity's `createdAt`.
chrono.workspace = true
getrandom.workspace = true
# The pidfile's OS half (inspect, alive, kill_tree): one verdict with k7-local's host.
k7-local.workspace = true
# EMFILE and ENFILE, the probe's third answer; getppid on Android.
libc = "0.2"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "signal", "io-util", "io-std"] }
url.workspace = true
# The cut's job id: a hash of the work, as the C++ supervisor's mbedTLS SHA-256 gave it.
sha2.workspace = true
# The engine's WebSocket (`engine_client`): one connection, a reader task, the frames typed by hand.
futures-util.workspace = true
tokio-tungstenite.workspace = true

[features]
# ONNX Runtime LOADED at the first cut, never linked (docs/rust-supervisor-plan.md, M7); off on iOS, where M9 links the xcframework.
default = ["dynamic-ort"]
dynamic-ort = ["ort/load-dynamic"]

# Stem separation is where ONNX Runtime ships a binary: not Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
# The media library's decoder and resampler, linked directly (the C++ supervisor reached them through a C ABI).
waveform = { path = "../waveform", features = ["encode"] }
# `api-24`: the oldest runtime we ship is DirectML's 1.24.4; the others are 1.30.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }

[target.'cfg(windows)'.dependencies]
# DirectML as the Windows provider; the library's own loader is used for DirectML.dll's folder.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "directml"] }
libloading = "0.9"

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "coreml"] }
