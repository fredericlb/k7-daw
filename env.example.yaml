common:
  # Signs the session cookie of the dev session's device front. At least 32 characters; the
  # merge is common-then-service, so a section CAN override this, and `SESSION_SECRET: ""`
  # overrides just as loudly.
  SESSION_SECRET: ""

k7-front:
  # Every section here is named after its service. A stale section name is not an
  # error — `loadServiceEnv` returns {} for a section it cannot find — so a file
  # carrying a spelling this one no longer uses silently falls back to `common` alone.
  #
  # The dev session is a DEVICE on loopback, as the tray and the e2e beds are: no login, the
  # page opens on http://127.0.0.1:5223 and `/auth/local` signs the machine's own user in
  # (loopback peers only).
  STUDIO_LOCAL_USER: "1"
  K7_INSTANCE: "local"
  # Accepts the short SESSION_SECRET a dev machine may carry (apps/k7/backend-rs/crates/k7-front/src/auth_guard.rs).
  STUDIO_DEV_AUTH: "1"
  # Signs the bearers the hub gives each account's file service. Leave it empty and
  # `npm run tokens` generates one: unset, the front falls back to
  # SESSION_SECRET + a suffix, so rotating the session secret would log everyone out
  # AND void every bearer in one move. See docs/tokens.md.
  API_TOKEN_SECRET: ""
  # The instance's data folder (`~/.k7/mediatek` by default).
  STUDIO_MEDIATEK: "/data/mediatek"
  # The accounts' workspaces, one file service per account under this folder — the ONLY place a
  # workspace lives (apps/k7/backend-rs/docs/files/hub.md). REQUIRED: without it the front answers no file hub.
  STUDIO_FILES_ROOT: "/data/workspaces"
  # What this service remembers about a person; defaults to ~/.studio/prefs/k7.
  # STUDIO_PREFS_DIR: "/data/prefs"
