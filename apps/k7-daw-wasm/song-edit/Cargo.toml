[package]
name = "song-edit"
version = "0.1.0"
edition = "2024"
description = "The song editor in Rust, base: the workspace's files read and written as k7x, the module folders, the confinement, the chain item and lane strip writes."
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
k7x = { path = "../k7x" }
song = { path = "../song", default-features = false }
sha2 = "0.10"
song-schema = { path = "../song-schema" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ts-rs = { version = "11", optional = true }

[features]
# The types of the intake, the kit and the buffer reads cross the ABI: k7-wasm's bindings binary writes their TypeScript.
ts = ["dep:ts-rs", "song-schema/ts", "song/ts"]

[dev-dependencies]

# The replays edit a thousand files: unoptimized, the k7x editor is slow.
[profile.dev.package.k7x]
opt-level = 2
