[package]
name = "k7-runtime-server"
description = "The engine's WebSocket server in Rust, over the C++ Tracktion host's C ABI (docs/rust-engine-server-plan.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The staticlib is what the C++ engine targets link (docs/link.md); the rlib is what the tests and the rest of the server use.
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The page's engine wire types, generated from the frame structs (docs/ts-types.md).
ts-rs = { workspace = true, optional = true }
# The keys and codes of a pairing: the OS's generator, as the C++ store used `random_device`.
getrandom.workspace = true
# A reply from the message thread (`Engine::call`'s one-shot channel), and the socket's runtime.
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "net", "time", "signal", "macros"] }
# The socket: tokio-tungstenite accepts, futures-util splits it into a reader and a writer.
tokio-tungstenite.workspace = true
futures-util.workspace = true

[target.'cfg(unix)'.dependencies]
# `_exit`, for an executable leaving with detached work still running (`entry.rs`).
libc = "0.2"

[features]
# The TypeScript types of the frames, written by k7-front's bindings binary.
ts = ["dep:ts-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "net", "time", "macros"] }

[[test]]
name = "all"
path = "tests/all/main.rs"
