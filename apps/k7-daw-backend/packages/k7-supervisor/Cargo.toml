[package]
name = "k7-supervisor"
description = "The engine machine's supervisor in Rust: starts, adopts and watches k7-runtime, speaks the host protocol over NDJSON stdio (docs/rust-supervisor-plan.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "k7-supervisor"
path = "src/main.rs"
test = false
doc = false

# An engine that speaks the engine wire from files, for the queries part's tests: `tests/all/queries.rs`.
[[bin]]
name = "k7-ws-engine"
path = "src/bin/ws_engine.rs"
test = false
doc = false

# The tunnel agent alone, which the conformance suite's stand-in engine runs beside its fake engine (`e2e/src/standInEngine.ts`).
[[bin]]
name = "tunnel_harness"
path = "src/bin/tunnel_harness.rs"
test = false
doc = false

# An engine that only listens, for the tests alone: `tests/all/supervisor.rs` runs it through `CARGO_BIN_EXE_k7-fake-engine`.
[[bin]]
name = "k7-fake-engine"
path = "src/bin/fake_engine.rs"
test = false
doc = false

[dependencies]
# Local wall-clock for the merged log's `HH:MM:SS`, UTC for the identity's `createdAt`.
chrono.workspace = true
getrandom.workspace = true
# The tunnel's frames, the hub's own code, reused so the two ends cannot drift.
k7-engine.workspace = true
# The pidfile's OS half (inspect, alive, kill_tree): one verdict with k7-local's host.
k7-local.workspace = true
# EMFILE and ENFILE, the probe's third answer; getppid on Android.
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
# The page's HostState type, generated from `protocol/wire.rs` (docs/ts-types.md).
ts-rs = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "signal", "io-util", "io-std", "net", "fs"] }
url.workspace = true
# The cut's job id: a SHA-256 of the work.
sha2.workspace = true
# The instruments' archives unpacked.
zip.workspace = true
# The engine's WebSocket (`engine_client`): one connection, a reader task, the frames typed by hand.
futures-util.workspace = true
tokio-tungstenite.workspace = true
# The registries' HTTPS (hello, heartbeat, deregister): hyper over rustls with ring, as the front's own client.
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
# The tunnel's TLS: the socket is dialled by hand so one configuration (`trust`) serves every connection.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots.workspace = true

# Phones keep the bundle the app ships; every computer reads its OS store.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rustls-native-certs.workspace = true

[dev-dependencies]
# The TLS test server of `tests/all/tls.rs`, over the same rustls and ring as the client.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[features]
# The TypeScript type of the `state` frame, written by k7-front's bindings binary.
ts = ["dep:ts-rs"]
# ONNX Runtime LOADED at the first cut, never linked (docs/rust-supervisor-plan.md, M7); off on iOS, where M9 links the xcframework.
default = ["dynamic-ort"]
dynamic-ort = ["ort/load-dynamic"]

# Stem separation is where ONNX Runtime ships a binary: not Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
# The media library's decoder and resampler, linked directly.
waveform = { path = "../waveform", features = ["encode"] }
# `api-24`: the oldest runtime we ship is DirectML's 1.24.4; the others are 1.30.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }

[target.'cfg(windows)'.dependencies]
# DirectML as the Windows provider; the library's own loader is used for DirectML.dll's folder.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "directml"] }
libloading = "0.9"
# The Windows-only calls of `src/win` (job object, TCP table, adapters, certificate stores, DXGI, the minidump), typed by hand nowhere.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "coreml"] }
