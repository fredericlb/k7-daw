# nextest's settings for the backend workspace (docs/rust-builds.md).
# What a reader gets wrong: the group is the tests that fill folders (file-service's hostile, journal, revision and
# watching files, capture_hostile), not every test named hostile; run together they woke the Mac's file-event and
# security agents until the load passed 60, so they run one at a time, as their time bounds assume.

# The group stays at 1 until the 2-at-a-time trial is measured over three runs (docs/rust-builds.md).
[test-groups]
file-churn = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(k7-file-service) & test(/(^| )(hostile|listings_hostile|entries_hostile|journal_hostile|journal_records|workspaces_hostile|revision|watching)::/)) | (package(k7-capture) & test(/capture_hostile::/))'
test-group = 'file-churn'

# The tests that failed only under load and passed alone: a pass on retry shows as flaky, not as a rerun of the whole gate.
# What a reader gets wrong: this list shrinks, as the queued `flaky-waits` job fixes each test; a new entry needs a reason.
[[profile.default.overrides]]
filter = 'test(/jobs_plugin/)'
retries = 2

# A deadlock check that hangs would hold a gate for ever: the ordering tests end in 30 s or are killed.
[[profile.default.overrides]]
filter = 'test(/tests_order::/)'
slow-timeout = { period = "30s", terminate-after = 2 }
