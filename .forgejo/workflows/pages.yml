# The static site k7.rocks built as .github/workflows/pages.yml builds it, then published to a self-hosted
# git-pages by Forgejo Actions (docs/forgejo-pages.md). GitHub never reads this folder, and Forgejo reads only it.
# What a reader gets wrong: no secret is needed; git-pages accepts the job's own token because the domain's
# `_git-pages-forge-allowlist` TXT record names this repository.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "site/**"
      - "scripts/buildSite.mjs"
      - "apps/k7-daw-frontend/docs-entry/**"
      - "apps/k7-daw-frontend/user-docs/**"
      - "apps/k7-daw-frontend/vite.docs.config.ts"
      - "apps/k7-daw-frontend/src/docs/**"
      - ".forgejo/workflows/pages.yml"
  workflow_dispatch:

# One publish at a time, and a newer one waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://code.forgejo.org/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: install
        run: npm ci
      - name: build the site
        run: node scripts/buildSite.mjs dist-site
      # The repository variable PAGES_SITE names another site (a trial server); unset, it is k7.rocks.
      - uses: https://code.forgejo.org/actions/git-pages@2b24bbb7ff943d3c8fe1df91326adec66daea6dd # v2.2.0
        with:
          site: ${{ vars.PAGES_SITE || 'https://k7.rocks/' }}
          token: ${{ forgejo.token }}
          source: dist-site/
          strict: true
          comment: ${{ forgejo.sha }}
