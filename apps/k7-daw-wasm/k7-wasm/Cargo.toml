[package]
name = "k7-wasm"
version = "0.1.0"
edition = "2024"
description = "The browser's one WebAssembly module: a C ABI carrying JSON, the dispatch of operations split by family, over song-schema, song (its decoders and views) and k7x."
publish = false

[lib]
path = "src/lib.rs"
# cdylib for WebAssembly, rlib for the tests, the bindings binary and a native host later.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bindings"
path = "src/bin/bindings/main.rs"
required-features = ["ts"]

[features]
ts = ["dep:ts-rs", "song-schema/ts", "song/ts", "chains/ts", "gesture/ts", "eyes/ts", "turntables/ts", "verbs?/ts", "git-rules/ts"]
# The verbs over a native host's file system, and the verb.catalogue op: built into no browser module (docs/verbs-port.md).
verbs = ["dep:verbs"]

[dependencies]
song-schema = { path = "../song-schema" }
gesture = { path = "../gesture" }
song = { path = "../song", default-features = false }
k7x = { path = "../k7x" }
eyes = { path = "../eyes" }
turntables = { path = "../turntables" }
song-edit = { path = "../song-edit" }
chains = { path = "../chains" }
indexmap = { version = "2", features = ["serde"] }
verbs = { path = "../verbs", optional = true }
git-rules = { path = "../git-rules" }
# The measure, the trim window and the WebM head patch, with no decoder or encoder (docs/analysis.md).
waveform = { path = "../../k7-daw-backend/packages/waveform", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ts-rs = { version = "11", optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
